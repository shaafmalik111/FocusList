<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#04241c">
  <meta name="description" content="Prayer and Quran tracker, tasks, notes and projects in one calm, mobile-first app.">
  <title>Focus List</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="masthead">
      <img src="icon.svg" alt="" width="30" height="30">
      <b>Focus List</b>
    </header>
    <main id="view"></main>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
  <div class="backdrop" id="backdrop"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
  <div class="toast" id="toast" role="status"></div>
  <script src="utils.js"></script>
  <script src="store.js"></script>
  <script src="reminders.js"></script>
  <script src="tasks.js"></script>
  <script src="notes.js"></script>
  <script src="projects.js"></script>
  <script src="settings.js"></script>
  <script src="salah.js"></script>
  <script src="main.js"></script>
</body>
</html>
